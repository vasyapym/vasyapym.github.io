name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: portfolio/projects/spine/go.mod
      - name: Install dependencies
        working-directory: portfolio
        run: npm ci
      - name: Check lesson chunks are committed
        working-directory: portfolio
        run: node ../scripts/check-lesson-chunks.mjs
      - name: Commit count for the hero kicker
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=""
          if headers=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/commits?per_page=1"); then
            link_line=$(printf '%s' "$headers" | tr -d '\r' | grep -i '^link:' | tail -1 || true)
            count=$(printf '%s' "$link_line" | grep -o 'page=[0-9]*>; rel="last"' | grep -o '[0-9]*' || true)
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: portfolio
        env:
          VITE_COMMITS_COUNT: ${{ steps.commits.outputs.count }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/shell/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
