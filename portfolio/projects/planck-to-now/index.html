<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23e8b57c'/><circle cx='50' cy='50' r='20' fill='%23eeeae0' /></svg>" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <title>planck to now</title>
<style>
  :root {
    --ink: #eeeae0;
    --dim: rgba(238, 234, 224, 0.66);
    --faint: rgba(238, 234, 224, 0.45);
    --line: rgba(238, 234, 224, 0.26);
    --accent: #e8b57c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink); }

  #app { position: fixed; inset: 0; z-index: 0; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.62) 100%); }
  #flash { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: #fff; opacity: 0; }

  .hud { position: fixed; z-index: 10; pointer-events: none; }

  #panel { top: 26px; left: 30px; max-width: 400px; padding: 14px 16px;
    border: 1px solid rgba(238, 234, 224, 0.2); background: rgba(11, 19, 23, 0.42);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    pointer-events: auto; cursor: pointer; }
  #epoch { font-size: 15px; font-weight: 500; letter-spacing: .05em; text-transform: lowercase; color: var(--accent);
    margin: 0 0 6px 0; }
  #epochdesc { font-size: 11.5px; line-height: 1.5; color: var(--dim); margin: 0 0 14px 0; }
  #stats { font-size: 12.5px; line-height: 1.75; white-space: pre; }
  #stats b { color: var(--ink); font-weight: 500; }

  #paused { top: 26px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: .08em;
    color: var(--accent); border: 1px solid var(--line); padding: 7px 14px; display: none; }

  #timeline { bottom: 64px; left: 50%; transform: translateX(-50%); width: min(760px, 82vw); height: 26px;
    cursor: pointer; touch-action: none; pointer-events: auto; }
  #tlbar { position: absolute; top: 11px; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #241509, #6e4a26, #a87f4e, #e8b57c); opacity: .85; }
  .tick { position: absolute; top: 8px; width: 1px; height: 9px; background: rgba(238,234,224,.3); }
  #cursor { position: absolute; top: 4px; width: 3px; height: 17px; background: var(--accent);
    box-shadow: 0 0 10px rgba(232,181,124,.55); margin-left: -1px; }

  #hints { bottom: 20px; right: 24px; font-size: 11px; color: var(--dim); text-align: right; line-height: 1.8; }
  kbd { display: inline-block; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 2px;
    padding: 0 5px; font-size: 10px; color: var(--ink); background: rgba(255,255,255,.05); margin: 0 2px; }

  #tech { bottom: 20px; left: 24px; font-size: 11px; color: var(--faint); letter-spacing: .04em; }

  /* the hint div is rendered (empty) from load and shown by setting its text:
     text changes repaint reliably, whereas elements that enter the tree late
     can stall out of the compositor under continuous WebGL load */
  #touchhint { bottom: 104px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-size: 11px; letter-spacing: .05em; color: var(--dim); }

  @media (max-width: 700px) {
    #tech { display: none; }
    #title { display: none; }
    #hints { display: none; }
    #stats { display: none; }
    /* the epoch text floats free of its box: same words, far less visual weight.
       30px insets clear the shader-drawn frame (14px line) with breathing room. */
    #panel { top: 30px; left: 30px; max-width: calc(100vw - 60px); padding: 0;
      border: none; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
    #epoch { font-size: 13px; margin: 0 0 4px 0; }
    #epochdesc { font-size: 10.5px; line-height: 1.45; margin: 0; }
    /* centered at top it collides with the epoch text — drop it to a toast
       slot above the touch hint (timeline 64px, touchhint 104px) instead */
    #paused { top: auto; bottom: 140px; }
  }

  #title { top: 26px; right: 30px; font-size: 11px; letter-spacing: .05em; color: var(--faint); }

  #err { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: #000;
    color: var(--dim); font-size: 13px; letter-spacing: .05em; padding: 40px; text-align: center; }

  #boot { position: fixed; inset: 0; z-index: 40; pointer-events: none; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .6s ease .15s, visibility 0s linear .8s; }
  html.p2n-live #boot { opacity: 0; visibility: hidden; }
  .boot-ember { width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle, #fff6e8 0%, #ffd9a0 38%, rgba(232,181,124,.55) 62%, rgba(232,181,124,0) 76%);
    box-shadow: 0 0 26px 6px rgba(232,181,124,.3);
    animation: boot-pulse 1.6s ease-in-out infinite; }
  .boot-word { margin-top: 18px; font-size: 13px; letter-spacing: .08em; color: var(--ink); }
  .boot-rule { position: relative; margin-top: 14px; width: 140px; height: 1px; background: var(--line); overflow: hidden; }
  .boot-rule::after { content: ""; position: absolute; top: 0; left: 0; width: 44px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,181,124,.85), transparent);
    animation: boot-sweep 2.2s linear infinite; }
  .boot-note { margin-top: 10px; font-size: 11px; color: var(--faint); }
  @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: .78; } 50% { transform: scale(1.16); opacity: 1; } }
  @keyframes boot-sweep { from { transform: translateX(-48px); } to { transform: translateX(148px); } }
  @media (prefers-reduced-motion: reduce) { .boot-ember, .boot-rule::after { animation: none; } }
</style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <span class="boot-ember"></span>
    <span class="boot-word">planck to now</span>
    <span class="boot-rule"></span>
    <span class="boot-note">warming the vacuum</span>
  </div>

  <div id="app"></div>
  <div id="vignette"></div>
  <div id="flash"></div>

  <div class="hud" id="panel">
    <h1 id="epoch">Planck Epoch</h1>
    <p id="epochdesc"></p>
    <div id="stats"></div>
  </div>

  <div class="hud" id="paused">paused</div>
  <div class="hud" id="timeline">
    <div id="tlbar"></div>
    <div id="ticks"></div>
    <div id="cursor"></div>
  </div>
  <div class="hud" id="hints">
    <span id="speedlabel">speed ×1.0</span><br />
    <kbd>space</kbd> pause · <kbd>R</kbd> restart · <kbd>↑</kbd><kbd>↓</kbd> speed<br />
    drag orbit · scroll zoom · drag timeline to scrub · click perturbs the field
  </div>
  <div class="hud" id="tech"><span id="techline">gpgpu</span> · <span id="fps">—</span> fps</div>
  <div class="hud" id="title">planck-to-now</div>
  <div class="hud" id="touchhint"></div>

  <div id="err"><div>webgl unavailable · simulation sealed</div></div>

  <script src="./dist/main.js"></script>
</body>
</html>
