<!doctype html><html lang="en"><head><meta charset="utf-8">

<style>
:root{--ink:#141412;--paper:#f3f0e9;--och:#c8801e}
*{margin:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.6 ui-monospace,Menlo,monospace;text-transform:lowercase}

.spec{margin-top:3rem;border:2px solid var(--ink);padding:1.5rem}
.spec div{font-size:2rem;line-height:1.3}
.spec .o{color:var(--och)}

<div class="row"><span>accent</span><span>#c8801e ochre</span></div>
<div class="row"><span>grid</span><span>hard rules, swiss habits</span></div>
<div class="row"><span>images</span><span>none. type is the illustration.</span></div>
<div class="spec">

</div>
</div>
